<style>
  :root {
    --navy-0: #05080f; --navy-1: #0a1424; --navy-2: #102341; --navy-3: #163a72;
    --blue: #1f5cd9; --blue-bright: #2f7fff;
    --gold: #f2b733; --gold-deep: #c8881a; --orange: #ff7a1a;
    --bone: #ece6d6; --white: #ffffff; --ink: #c9d4e6; --ink-dim: #6b7a92;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--navy-0); color: var(--white); font-family: 'Barlow', system-ui, sans-serif; overflow-x: hidden; min-height: 100vh; }
  #root { min-height: 100vh; }
  .h-display { font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif; letter-spacing: 0.01em; }
  .h-cond    { font-family: 'Barlow Condensed', sans-serif; }
  .mono      { font-family: 'JetBrains Mono', monospace; }

  .arena-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(80% 60% at 12% 0%, rgba(242,183,51,0.18), transparent 60%),
      radial-gradient(60% 50% at 95% 30%, rgba(31,92,217,0.32), transparent 60%),
      radial-gradient(70% 70% at 50% 110%, rgba(31,92,217,0.18), transparent 60%),
      linear-gradient(180deg, #050913 0%, #07101f 40%, #050913 100%);
  }
  .arena-bg::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 7px),
      radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: screen;
  }
  .grain {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; opacity: 0.06;
    background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 80% 70%, #fff, transparent), radial-gradient(1px 1px at 40% 90%, #fff, transparent), radial-gradient(1px 1px at 60% 10%, #fff, transparent);
    background-size: 200px 200px, 250px 250px, 180px 180px, 220px 220px;
  }

  /* ── ANIMATIONS ── */
  @keyframes slideUp    { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUpStat{ from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes titleIn    { from { opacity:0; } to { opacity:1; } }
  @keyframes progressFill { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes cinePop    { from { opacity:0; transform:translateY(20px); filter:blur(6px); } to { opacity:1; transform:translateY(0); filter:blur(0); } }
  @keyframes fade       { from { opacity:0 } to { opacity:1 } }
  @keyframes tFlash     { 0%{background:#000;opacity:0} 30%{background:#fff;opacity:1} 100%{background:#000;opacity:0} }
  @keyframes tWipeR     { from{clip-path:inset(0 0 0 0)} to{clip-path:inset(0 0 0 100%)} }
  @keyframes tShutter   { 0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)} 100%{clip-path:polygon(0 50%,100% 50%,100% 50%,0 50%)} }

  .cine-pop1 { animation: cinePop 700ms ease both; }
  .cine-pop2 { animation: cinePop 900ms 200ms ease both; }
  .cine-pop3 { animation: cinePop 900ms 500ms ease both; }
  .cine-pop4 { animation: cinePop 900ms 800ms ease both; }
  .cine-fade { animation: titleIn 400ms ease both; }
  .t-flash::after { content:""; position:absolute; top:0; left:0; right:0; bottom:0; background:#fff; animation:tFlash 600ms ease forwards; pointer-events:none; }
  .t-wipe    { animation: tWipeR 600ms ease forwards; }
  .t-shutter { animation: tShutter 600ms ease forwards; }
  .t-cut     { animation: titleIn 100ms ease forwards reverse; }

  /* ── HUB LAYOUT ── */
  .hub-wrap {
    position: relative; z-index: 2;
    padding: 40px clamp(16px, 4vw, 64px) 80px;
    max-width: 1600px; margin: 0 auto;
  }
  .hub-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px; gap: 12px; flex-wrap: wrap;
  }
  .hero-grid {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 32px; align-items: stretch;
    margin-bottom: 56px; min-height: 480px;
  }
  .hero-left  { position: relative; padding: 24px 0; overflow: visible; }
  .hero-right { position: relative; cursor: pointer; }
  .hero-poster-inner {
    position: relative; height: 100%; width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden; background: var(--navy-1); min-height: 480px;
  }
  .cta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 36px; position: relative; z-index: 2; }
  .cta-btn-primary {
    border: none; padding: 16px 28px;
    background: var(--gold); color: #0a0a0a; cursor: pointer;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.16em;
    touch-action: manipulation;
  }
  .cta-btn-secondary {
    border: 1px solid rgba(255,255,255,0.2); padding: 16px 24px;
    background: transparent; color: #fff; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.18em;
    touch-action: manipulation;
  }
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0; margin-bottom: 56px;
    border-left: 1px solid rgba(255,255,255,0.1);
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .clips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .posters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .hub-footer {
    margin-top: 64px; padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px;
  }

  /* ── CINEMATIC LAYOUT ── */
  .cine-hud-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    padding: 20px 28px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .cine-rec-label { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); }
  .cine-hud-actions { display: flex; gap: 12px; align-items: center; pointer-events: auto; }
  .cine-hud-bot {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    padding: 0 28px 20px;
  }
  .cine-lower {
    position: absolute; left: 36px; bottom: 60px;
    animation: slideUp 500ms ease both; max-width: 540px;
  }
  .cine-lower-title { font-size: clamp(32px, 7vw, 64px); line-height: 0.9; color: #fff; letter-spacing: 0.02em; }
  .cine-stat-tag {
    position: absolute; right: 36px; top: 90px;
    animation: slideUpStat 600ms 200ms ease both; text-align: right;
  }
  .cine-brand-mark { position: absolute; right: 36px; bottom: 60px; opacity: 0.85; }
  .cine-hud-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 8px 14px; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; font-size: 13px;
    touch-action: manipulation; min-height: 44px;
  }
  .cine-audio-btn {
    padding: 8px 14px; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.2em; font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px;
    touch-action: manipulation; min-height: 44px;
  }

  /* ── TABLET (≤ 1024px) ── */
  @media (max-width: 1024px) {
    .stat-strip { grid-template-columns: repeat(4, 1fr); }
    .hero-grid  { gap: 24px; }
  }

  /* ── PHABLET / LARGE MOBILE (≤ 768px) ── */
  @media (max-width: 768px) {
    .hero-grid {
      grid-template-columns: 1fr;
      min-height: auto; margin-bottom: 32px;
    }
    .hero-right { order: -1; }
    .hero-poster-inner { min-height: 260px !important; }
    .hero-ghost { display: none; }
    .cta-btn-primary, .cta-btn-secondary { width: 100%; justify-content: center; }
    .cta-row { flex-direction: column; }
    .cine-stat-tag { display: none; }
    .clips-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  }

  /* ── MOBILE (≤ 640px) ── */
  @media (max-width: 640px) {
    .hub-wrap { padding: 20px 16px 60px; }
    .hub-header-meta { display: none; }
    .stat-strip { grid-template-columns: repeat(4, 1fr); }
    .clips-grid { grid-template-columns: 1fr; }
    .posters-grid { grid-template-columns: repeat(2, 1fr); }
    .cine-hud-top { padding: 12px 14px; gap: 6px; }
    .cine-rec-label { display: none; }
    .cine-hud-bot { padding: 0 14px 10px; }
    .cine-lower { left: 16px; bottom: 44px; max-width: calc(100vw - 32px); }
    .cine-brand-mark { right: 16px; bottom: 44px; }
    .cine-hud-btn, .cine-audio-btn { font-size: 11px; padding: 6px 10px; }
    .hub-footer { flex-direction: column; align-items: flex-start; }
  }

  /* ── SMALL MOBILE (≤ 400px) ── */
  @media (max-width: 400px) {
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
    .posters-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── VIDEO & FULLSCREEN (iOS Safari) ── */
  html, body { height: -webkit-fill-available; }

  /* Fullscreen overlay — four insets beat any height/width calculation on iOS */
  .fullscreen-view {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    background: #000;
    overflow: hidden;
  }

  /* Video fills container while preserving aspect ratio — works on all iOS */
  /* Replaces object-fit:cover which Chrome iOS does not honour on <video> */
  .fill-video {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }

  /* Clip cards — video is in flow and sets the card height naturally */
  .clip-card {
    position: relative;
    width: 100%;
    cursor: pointer;
    overflow: hidden;
    background: var(--navy-1);
    touch-action: manipulation;
  }

  /* HUD bars inset for notch / home-indicator safe areas */
  .cine-hud-top {
    padding-top: max(20px, calc(env(safe-area-inset-top) + 12px));
    padding-left:  max(28px, calc(env(safe-area-inset-left) + 14px));
    padding-right: max(28px, calc(env(safe-area-inset-right) + 14px));
  }
  .cine-hud-bot {
    padding-bottom: max(20px, calc(env(safe-area-inset-bottom) + 10px));
    padding-left:   max(28px, calc(env(safe-area-inset-left) + 14px));
    padding-right:  max(28px, calc(env(safe-area-inset-right) + 14px));
  }
  .cine-lower {
    left: max(36px, calc(env(safe-area-inset-left) + 16px));
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 50px));
  }
  .cine-stat-tag {
    right: max(36px, calc(env(safe-area-inset-right) + 16px));
  }
  .cine-brand-mark {
    right:   max(36px, calc(env(safe-area-inset-right) + 16px));
    bottom:  max(60px, calc(env(safe-area-inset-bottom) + 50px));
  }

  @media (max-width: 640px) {
    .cine-hud-top {
      padding-top: max(12px, calc(env(safe-area-inset-top) + 8px));
      padding-left: max(14px, calc(env(safe-area-inset-left) + 10px));
      padding-right: max(14px, calc(env(safe-area-inset-right) + 10px));
    }
    .cine-hud-bot {
      padding-bottom: max(10px, calc(env(safe-area-inset-bottom) + 8px));
      padding-left: max(14px, calc(env(safe-area-inset-left) + 10px));
      padding-right: max(14px, calc(env(safe-area-inset-right) + 10px));
    }
    .cine-lower {
      left: max(16px, calc(env(safe-area-inset-left) + 12px));
      bottom: max(48px, calc(env(safe-area-inset-bottom) + 44px));
    }
    .cine-brand-mark {
      right:  max(16px, calc(env(safe-area-inset-right) + 12px));
      bottom: max(48px, calc(env(safe-area-inset-bottom) + 44px));
    }
  }
</style>

  // Fix iOS Safari: --vh is the true 1% of visible viewport height (no browser chrome)
  function setVH() {

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*'); } catch(e) {}
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {

  const offsetRef = React.useRef({ x: 16, y: 16 });

    const p = dragRef.current; if (!p) return;
    const maxR = Math.max(PAD, window.innerWidth - p.offsetWidth - PAD);
    const maxB = Math.max(PAD, window.innerHeight - p.offsetHeight - PAD);
    offsetRef.current = { x: Math.min(maxR, Math.max(PAD, offsetRef.current.x)), y: Math.min(maxB, Math.max(PAD, offsetRef.current.y)) };
    p.style.right = offsetRef.current.x + 'px'; p.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clamp();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clamp) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clamp); return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);
  React.useEffect(() => {
    const onMsg = (e) => { const t = e?.data?.type; if (t==='__activate_edit_mode') setOpen(true); else if (t==='__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(e) {} };
  const onDragStart = (e) => {
    const p = dragRef.current; if (!p) return;
    const r = p.getBoundingClientRect();
    const sR = window.innerWidth - r.right, sB = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: sR-(ev.clientX-e.clientX), y: sB-(ev.clientY-e.clientY) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (<><style>{__TWEAKS_STYLE}</style><div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}><div className="twk-hd" onMouseDown={onDragStart}><b>{title}</b><button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button></div><div className="twk-body">{children}</div></div></>);
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value); valueRef.current = value;
  const labelLen = (o) => String(typeof o==='object' ? o.label : o).length;
  const maxLen = options.reduce((m,o)=>Math.max(m,labelLen(o)),0);
  const fitsAsSegments = maxLen <= ({2:16,3:10}[options.length]??0);
  if (!fitsAsSegments) {
    const resolve = (s) => { const m = options.find(o=>String(typeof o==='object'?o.value:o)===s); return m===undefined?s:typeof m==='object'?m.value:m; };
    return <TweakRow label={label}><select className="twk-field" value={value} onChange={e=>onChange(resolve(e.target.value))}>{options.map(o=>{const v=typeof o==='object'?o.value:o;const l=typeof o==='object'?o.label:o;return <option key={v} value={v}>{l}</option>;})}</select></TweakRow>;
  }
  const opts = options.map(o=>typeof o==='object'?o:{value:o,label:o});
  const idx = Math.max(0, opts.findIndex(o=>o.value===value));
  const n = opts.length;
  const segAt = (x) => { const r=trackRef.current.getBoundingClientRect(); const i=Math.floor(((x-r.left-2)/(r.width-4))*n); return opts[Math.max(0,Math.min(n-1,i))].value; };
  const onPointerDown = (e) => {
    setDragging(true); const v0=segAt(e.clientX); if(v0!==valueRef.current) onChange(v0);
    const move=(ev)=>{ if(!trackRef.current)return; const v=segAt(ev.clientX); if(v!==valueRef.current) onChange(v); };
    const up=()=>{ setDragging(false); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  };
  return (<TweakRow label={label}><div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging?'twk-seg dragging':'twk-seg'}><div className="twk-seg-thumb" style={{left:`calc(2px + ${idx}*(100% - 4px)/${n})`,width:`calc((100% - 4px)/${n})`}}/>{opts.map(o=><button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}</div></TweakRow>);
}

function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--navy-0', t.bg0); r.setProperty('--navy-1', t.bg1); r.setProperty('--navy-2', t.bg2);
  r.setProperty('--blue', t.blue); r.setProperty('--blue-bright', t.blueBright);
  r.setProperty('--gold', t.accent); r.setProperty('--gold-deep', t.accentDeep); r.setProperty('--bone', t.bone);
}

function BrushStroke({ color="#1f5cd9", width=320, height=30, seed=1, style={} }) {
  const bands = [];
  const N = 14;
  for (let i=0;i<N;i++) {
    const y=(i/(N-1))*height, wobble=Math.sin(i*1.7+seed)*6;
    const x1=4+Math.abs(Math.sin(i+seed))*8, x2=width-4-Math.abs(Math.cos(i*0.6+seed))*14;
    const o=0.25+0.75*(1-Math.abs(i-N/2)/(N/2));
    bands.push(<line key={i} x1={x1} x2={x2} y1={y} y2={y+wobble*0.3} stroke={color} strokeOpacity={o} strokeWidth={1.4} strokeLinecap="round"/>);
  }
  return (<svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{display:'block',...style}}><defs><filter id={`b${seed}`}><feTurbulence baseFrequency="0.9" numOctaves="2" seed={seed}/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs><g filter={`url(#b${seed})`}>{bands}</g></svg>);
}

function Emblem({ size=56, accent="var(--gold)", deep="var(--gold-deep)" }) {
  return (<svg viewBox="0 0 100 100" width={size} height={size} style={{display:'block'}}><defs><radialGradient id="em-g" cx="0.4" cy="0.35"><stop offset="0" stopColor="#ffd97a"/><stop offset="0.55" stopColor={accent}/><stop offset="1" stopColor={deep}/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#em-g)" stroke="#3a2a05" strokeWidth="2"/><circle cx="50" cy="50" r="38" fill="none" stroke="#fff7d6" strokeOpacity="0.7" strokeWidth="1.2"/><g fill="#1a1207"><rect x="28" y="28" width="6" height="40"/><rect x="28" y="62" width="22" height="6"/><rect x="56" y="28" width="6" height="40"/><rect x="56" y="62" width="20" height="6"/></g><path d="M 14 50 Q 50 35, 86 50" fill="none" stroke="#3a2a05" strokeWidth="1" strokeOpacity="0.4"/></svg>);
}

function NameLockup({ first="LANDON", last="LUKAS", scale=1 }) {
  const fs1 = `clamp(${Math.round(48*scale)}px, ${Math.round(8*scale)}vw, ${Math.round(96*scale)}px)`;
  const fs2 = `clamp(${Math.round(54*scale)}px, ${Math.round(9*scale)}vw, ${Math.round(110*scale)}px)`;
  const brushW = Math.round(110 * scale * 4.2);
  const brushH = Math.round(14 * scale);
  return (
    <div style={{position:'relative',display:'inline-block',lineHeight:0.85}}>
      <div className="h-display" style={{fontSize:fs1,color:'#f4efe1',letterSpacing:'0.02em',textShadow:'0 4px 18px rgba(0,0,0,0.55)',transform:'skewX(-6deg)',transformOrigin:'left bottom'}}>{first}</div>
      <div style={{position:'relative',marginTop:`${4*scale}px`}}>
        <div className="h-display" style={{position:'relative',zIndex:2,fontSize:fs2,color:'var(--blue-bright)',letterSpacing:'0.01em',fontStyle:'italic',transform:'skewX(-10deg)',transformOrigin:'left bottom',textShadow:'0 6px 24px rgba(31,92,217,0.55)'}}>{last}</div>
        <BrushStroke color="var(--bone)" width={brushW} height={brushH} seed={4} style={{position:'absolute',left:-4,bottom:`${-8*scale}px`,opacity:0.85}}/>
      </div>
    </div>
  );
}

function GhostNumber({ n=5, size=360, color="rgba(255,255,255,0.08)", strokeColor="rgba(255,255,255,0.22)" }) {
  return (<div className="h-display" style={{fontSize:size,lineHeight:0.8,color,WebkitTextStroke:`2px ${strokeColor}`,letterSpacing:0,pointerEvents:'none',userSelect:'none'}}>{n}</div>);
}

function BrushField({ opacity=0.45 }) {
  const lines = [];
  for (let i=0;i<22;i++) {
    const col = i%5===0?'var(--bone)':'var(--blue)';
    const op = (i%5===0?0.5:0.35)*opacity;
    lines.push(<div key={i} style={{position:'absolute',top:`${(i*7)-20}%`,left:`${-20+(i%3)*8}%`,width:`${50+(i%4)*16}%`,height:2+(i%3),background:col,opacity:op,transform:'rotate(-22deg)',filter:'blur(0.4px)'}}/>);
  }
  return <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,overflow:'hidden',pointerEvents:'none'}}>{lines}</div>;
}

function ClipCard({ clip, idx, onPlay, hovered, setHovered }) {
  const videoRef = React.useRef(null);
  const isHover = hovered === idx;
  React.useEffect(() => {
    const v = videoRef.current; if (!v) return;
    if (isHover) { v.currentTime=0; v.play().catch(()=>{}); } else { v.pause(); v.currentTime=0; }
  }, [isHover]);
  return (
    <div onMouseEnter={()=>setHovered(idx)} onMouseLeave={()=>setHovered(null)} onClick={()=>onPlay(idx)}
      className="clip-card"
      style={{border:'1px solid',borderColor:isHover?'var(--blue-bright)':'rgba(255,255,255,0.06)',transition:'transform 220ms ease, border-color 220ms',transform:isHover?'translateY(-4px)':'translateY(0)'}}>
      {/* Video absolutely fills JS-set card height; transform centering avoids object-fit */}
      <video ref={videoRef} src={clip.src} muted playsInline webkit-playsinline="true" preload="metadata"
        style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',minWidth:'100%',minHeight:'100%',width:'auto',height:'auto',opacity:isHover?1:0.55,transition:'opacity 280ms',filter:isHover?'none':'saturate(0.8) contrast(1.05)'}}/>
      {/* All overlays positioned absolutely over the video */}
      <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:isHover?'linear-gradient(180deg,rgba(5,8,15,0)0%,rgba(5,8,15,0)50%,rgba(5,8,15,0.92)100%)':'linear-gradient(180deg,rgba(5,8,15,0.5)0%,rgba(16,35,65,0.4)50%,rgba(5,8,15,0.95)100%)',pointerEvents:'none'}}/>
      <div className="mono" style={{position:'absolute',top:14,left:14,fontSize:11,color:'var(--gold)',letterSpacing:'0.2em'}}>PLAY · {String(idx+1).padStart(2,'0')} / {String(data.clips.length).padStart(2,'0')}</div>
      <div className="h-cond" style={{position:'absolute',top:14,right:14,fontSize:11,fontWeight:700,letterSpacing:'0.18em',padding:'4px 10px',background:'var(--blue)',color:'#fff',clipPath:'polygon(8% 0,100% 0,92% 100%,0 100%)'}}>{clip.tag}</div>
      <div style={{position:'absolute',left:16,right:16,bottom:14}}>
        <div className="h-display" style={{fontSize:'clamp(22px,3.5vw,30px)',lineHeight:1,color:'#fff',letterSpacing:'0.02em',textShadow:'0 2px 10px rgba(0,0,0,0.6)'}}>{clip.label}</div>
        <div className="mono" style={{marginTop:4,fontSize:10,color:'var(--ink)',letterSpacing:'0.18em'}}>{clip.context}</div>
      </div>
      <div style={{position:'absolute',right:16,bottom:56,width:38,height:38,borderRadius:'50%',background:'var(--gold)',display:'grid',placeItems:'center',opacity:isHover?1:0,transform:isHover?'scale(1)':'scale(0.7)',transition:'all 240ms'}}>
        <div style={{width:0,height:0,borderLeft:'11px solid #0a0a0a',borderTop:'7px solid transparent',borderBottom:'7px solid transparent',marginLeft:3}}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// CINEMATIC VIEW
// ═══════════════════════════════════════════════════════════

const CLIP_MAX = 14;
const TRANSITIONS = ['cut','wipe','flash','shutter','wipe','cut','flash'];

function SpeakerIcon({ muted }) {
  return (<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/>{!muted&&<path d="M16 8c1.5 1 2.5 2.5 2.5 4s-1 3-2.5 4" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round"/>}{!muted&&<path d="M19 5c2.5 1.6 4 4.2 4 7s-1.5 5.4-4 7" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round"/>}{muted&&<path d="M16 8l6 8M22 8l-6 8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>}</svg>);
}

function CinematicHUD({ idx, total, phase, onExit, audioMuted, onToggleAudio }) {
  return (
    <>
      <div className="cine-hud-top">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Emblem size={28}/>
          <div className="mono cine-rec-label">REC ● LANDON LUKAS HIGHLIGHTS · VOL.01</div>
        </div>
        <div className="cine-hud-actions">
          <div className="mono" style={{fontSize:'clamp(9px,1.5vw,11px)',color:'#fff',letterSpacing:'0.22em'}}>
            {phase==='intro'?'COLD OPEN':phase==='outro'?'OUTRO':`${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`}
          </div>
          <button onClick={onToggleAudio} className="cine-audio-btn" style={{background:audioMuted?'transparent':'var(--gold)',color:audioMuted?'#fff':'#0a0a0a',border:'1px solid '+(audioMuted?'rgba(255,255,255,0.3)':'var(--gold)')}}>
            <SpeakerIcon muted={audioMuted}/>
            {audioMuted?'SOUND ON':'MUTE'}
          </button>
          <button onClick={onExit} className="cine-hud-btn">EXIT ✕</button>
        </div>
      </div>
      <div className="cine-hud-bot">
        <div style={{display:'flex',gap:4}}>
          {Array.from({length:total}).map((_,i) => (
            <div key={i} style={{flex:1,height:3,background:'rgba(255,255,255,0.15)',overflow:'hidden',position:'relative'}}>
              <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:i<idx||(i===idx&&phase==='transition')?'var(--gold)':i===idx&&phase==='play'?'var(--blue-bright)':'transparent',width:'100%',animation:i===idx&&phase==='play'?`progressFill ${CLIP_MAX}s linear forwards`:'none',transformOrigin:'left'}}/>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:6}}>
          <div className="mono" style={{fontSize:'clamp(7px,1.2vw,9px)',color:'var(--ink-dim)',letterSpacing:'0.24em'}}>ESC EXIT · → SKIP · M MUTE</div>
          <div className="mono" style={{fontSize:'clamp(7px,1.2vw,9px)',color:'var(--ink-dim)',letterSpacing:'0.24em'}}>SOUNDTRACK</div>
        </div>
      </div>
    </>
  );
}

function IntroCard({ data }) {
  return (
    <div className="cine-fade" style={{position:'absolute',top:0,left:0,right:0,bottom:0,display:'grid',placeItems:'center',background:'radial-gradient(60% 60% at 50% 50%,rgba(31,92,217,0.25),transparent 65%),#000'}}>
      <BrushField opacity={0.4}/>
      <div style={{position:'relative',textAlign:'center',zIndex:2,padding:'0 clamp(16px,5vw,48px)'}}>
        <div className="mono cine-pop1" style={{fontSize:'clamp(9px,1.5vw,12px)',letterSpacing:'0.4em',color:'var(--gold)',marginBottom:22}}>▸ A LANDON LUKAS HIGHLIGHT REEL</div>
        <div className="cine-pop2"><NameLockup first={data.first} last={data.last} scale={1.5}/></div>
        <div className="cine-pop3" style={{marginTop:32,display:'inline-flex',alignItems:'center',gap:'clamp(12px,3vw,26px)',flexWrap:'wrap',justifyContent:'center'}}>
          <div className="h-display" style={{fontSize:'clamp(52px,10vw,88px)',color:'var(--bone)',lineHeight:1}}>#{data.number}</div>
          <div style={{width:1,height:56,background:'rgba(255,255,255,0.3)'}}/>
          <div style={{textAlign:'left'}}>
            <div className="h-cond" style={{fontSize:'clamp(16px,3vw,22px)',fontWeight:700,letterSpacing:'0.3em',color:'#fff'}}>{data.position}</div>
            <div className="mono" style={{fontSize:'clamp(9px,1.5vw,11px)',letterSpacing:'0.24em',color:'var(--ink)',marginTop:6}}>{data.height} · {data.ageGroup} · {data.school}</div>
          </div>
        </div>
        <div className="cine-pop4 mono" style={{marginTop:36,fontSize:'clamp(9px,1.5vw,11px)',color:'var(--ink-dim)',letterSpacing:'0.32em'}}>{data.tagline}</div>
      </div>
    </div>
  );
}

function TitleCard({ clip, idx, total }) {
  return (
    <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:'#000',display:'grid',placeItems:'center',animation:'titleIn 200ms ease'}}>
      <BrushField opacity={0.35}/>
      <div style={{position:'relative',zIndex:2,textAlign:'left',padding:'0 clamp(16px,8vw,8vw)'}}>
        <div className="mono" style={{fontSize:'clamp(9px,1.5vw,12px)',letterSpacing:'0.4em',color:'var(--gold)',marginBottom:18,animation:'slideUp 400ms ease both'}}>
          PLAY {String(idx+1).padStart(2,'0')} / {String(total).padStart(2,'0')} · {clip.tag}
        </div>
        <div className="h-display" style={{fontSize:'clamp(52px,12vw,200px)',lineHeight:0.85,color:'#fff',letterSpacing:'0.01em',animation:'slideUp 600ms 100ms ease both'}}>{clip.label}</div>
        <div style={{position:'relative',marginTop:14,animation:'slideUp 700ms 200ms ease both'}}>
          <BrushStroke color="var(--blue-bright)" width={Math.min(500, window.innerWidth - 64)} height={20} seed={idx+7}/>
        </div>
        <div className="mono" style={{fontSize:'clamp(11px,2vw,14px)',letterSpacing:'0.28em',color:'var(--ink)',marginTop:22,animation:'slideUp 700ms 300ms ease both'}}>{clip.context}</div>
      </div>

}

function ClipStage({ videoRef, clip, phase, transition, idx, data }) {
  const transClass = phase==='transition'?`t-${transition}`:'';
  return (
    <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,overflow:'hidden'}} className={transClass}>
      <video ref={videoRef} src={clip.src} muted playsInline webkit-playsinline="true" className="fill-video"/>
      <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,pointerEvents:'none',background:'radial-gradient(75% 65% at 50% 50%,transparent 50%,rgba(0,0,0,0.55)100%)'}}/>
      <div className="cine-lower">
        <div className="mono" style={{fontSize:'clamp(8px,1.2vw,10px)',letterSpacing:'0.36em',color:'var(--gold)',marginBottom:8}}>▸ {clip.tag}</div>
        <div className="h-display cine-lower-title">{clip.label}</div>
        <div style={{marginTop:6}}><BrushStroke color="var(--blue-bright)" width={Math.min(320,window.innerWidth*0.55)} height={12} seed={idx+11}/></div>
        <div className="mono" style={{fontSize:'clamp(9px,1.5vw,11px)',letterSpacing:'0.24em',color:'var(--ink)',marginTop:10}}>{clip.context}</div>
      </div>
      <div className="cine-stat-tag">
        <div className="h-display" style={{fontSize:'clamp(28px,5vw,48px)',color:'var(--gold)',lineHeight:1}}>{clip.stat}</div>
        <div className="mono" style={{fontSize:10,letterSpacing:'0.32em',color:'var(--bone)',marginTop:4}}>#{data.number} · {data.position}</div>
      </div>
      <div className="cine-brand-mark"><Emblem size={40}/></div>
    </div>
  );
}

function OutroCard({ data, onExit }) {
  return (
    <div className="cine-fade" style={{position:'absolute',top:0,left:0,right:0,bottom:0,display:'grid',placeItems:'center',background:'radial-gradient(60% 60% at 50% 50%,rgba(31,92,217,0.3),transparent 65%),#000'}}>
      <BrushField opacity={0.4}/>
      <div style={{position:'relative',zIndex:2,textAlign:'center',padding:'0 clamp(16px,6vw,6vw)'}}>
        <div className="cine-pop1 mono" style={{fontSize:'clamp(9px,1.5vw,12px)',letterSpacing:'0.4em',color:'var(--gold)',marginBottom:20}}>THAT'S THE TAPE.</div>
        <div className="cine-pop2 h-display" style={{fontSize:'clamp(52px,12vw,180px)',lineHeight:0.85,color:'#fff',letterSpacing:'0.02em'}}>{data.tagline}</div>
        <div className="cine-pop3" style={{marginTop:36,display:'inline-flex',alignItems:'center',gap:18,flexWrap:'wrap',justifyContent:'center'}}>
          <Emblem size={48}/>
          <div style={{textAlign:'left'}}>
            <div className="h-cond" style={{fontSize:'clamp(14px,2.5vw,18px)',fontWeight:700,letterSpacing:'0.28em',color:'#fff'}}>{data.first} {data.last} · #{data.number}</div>
            <div className="mono" style={{fontSize:'clamp(9px,1.5vw,11px)',letterSpacing:'0.24em',color:'var(--ink)',marginTop:6}}>{data.team} · {data.league} · {data.classOf}</div>
          </div>
        </div>
        <button onClick={onExit} className="cine-pop4" style={{marginTop:40,background:'var(--gold)',color:'#0a0a0a',border:'none',cursor:'pointer',padding:'14px 30px',fontFamily:"'Bebas Neue',sans-serif",fontSize:18,letterSpacing:'0.18em',clipPath:'polygon(0 0,100% 0,96% 100%,4% 100%)',display:'block',touchAction:'manipulation',minHeight:44}}>BACK TO REEL</button>
      </div>
    </div>
  );
}

function CinematicView({ data, onExit, audioMuted, onToggleAudio }) {
  const [phase, setPhase] = React.useState('intro');
  const [idx, setIdx] = React.useState(0);
  const [transition, setTransition] = React.useState('cut');
  const videoRef = React.useRef(null);

  React.useEffect(() => {
    let t;
    if (phase==='intro') t=setTimeout(()=>{setPhase('title');setIdx(0);},3600);
    else if (phase==='title') t=setTimeout(()=>setPhase('play'),1600);
    else if (phase==='transition') t=setTimeout(()=>{if(idx+1>=data.clips.length)setPhase('outro');else{setIdx(idx+1);setPhase('title');}},600);
    else if (phase==='outro') t=setTimeout(()=>onExit(),5500);
    return ()=>clearTimeout(t);
  }, [phase,idx]);

  React.useEffect(() => {
    if (phase!=='play') return;
    const v=videoRef.current; if(!v) return;
    v.currentTime=0; v.muted=true; v.play().catch(()=>{});
    const goNext=()=>{clearTimeout(cap);setTransition(TRANSITIONS[idx%TRANSITIONS.length]);setPhase('transition');};
    const cap=setTimeout(goNext,CLIP_MAX*1000);
    v.addEventListener('ended',goNext);
    return ()=>{v.removeEventListener('ended',goNext);clearTimeout(cap);};
  }, [phase,idx]);

  React.useEffect(() => {
    const onKey=(e)=>{
      if(e.key==='Escape') onExit();
      if(e.key==='ArrowRight'&&phase==='play'){setTransition(TRANSITIONS[idx%TRANSITIONS.length]);setPhase('transition');}
      if((e.key==='m'||e.key==='M')&&onToggleAudio) onToggleAudio();
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  }, [phase,idx,onToggleAudio]);

  const clip=data.clips[idx], total=data.clips.length;
  return (
    <div className="fullscreen-view" style={{fontFamily:'Barlow,sans-serif'}}>
      <CinematicHUD idx={idx} total={total} phase={phase} onExit={onExit} audioMuted={audioMuted} onToggleAudio={onToggleAudio}/>
      {phase==='intro'&&<IntroCard data={data}/>}
      {phase==='title'&&<TitleCard clip={clip} idx={idx} total={total}/>}
      {(phase==='play'||phase==='transition')&&<ClipStage videoRef={videoRef} clip={clip} phase={phase} transition={transition} idx={idx} data={data}/>}
      {phase==='outro'&&<OutroCard data={data} onExit={onExit}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// SINGLE CLIP VIEW
// ═══════════════════════════════════════════════════════════

function SingleClipView({ data, startIdx, onExit, audioMuted, onToggleAudio }) {
  const [idx, setIdx] = React.useState(startIdx);
  const clip = data.clips[idx];
  const ref = React.useRef(null);

  React.useEffect(() => {
    const v=ref.current; if(!v) return;
    v.currentTime=0; v.muted=true;
    v.play().then(()=>{
      // iOS: hand off to native player which always sizes correctly
      if(v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    }).catch(()=>{});
    const onEnd=()=>{if(idx+1<data.clips.length)setIdx(idx+1);else onExit();};
    const onExitFS=()=>onExit(); // user dismissed native player
    v.addEventListener('ended',onEnd);
    v.addEventListener('webkitendfullscreen',onExitFS);
    return ()=>{
      v.removeEventListener('ended',onEnd);
      v.removeEventListener('webkitendfullscreen',onExitFS);
    };
  }, [idx]);

  React.useEffect(() => {
    const onKey=(e)=>{
      if(e.key==='Escape') onExit();
      if(e.key==='ArrowRight') setIdx(i=>Math.min(i+1,data.clips.length-1));
      if(e.key==='ArrowLeft')  setIdx(i=>Math.max(i-1,0));
      if((e.key==='m'||e.key==='M')&&onToggleAudio) onToggleAudio();
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  }, [onToggleAudio]);

  return (
    <div className="fullscreen-view">
      <video ref={ref} src={clip.src} muted playsInline webkit-playsinline="true" className="fill-video"/>
      <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:'radial-gradient(75% 65% at 50% 50%,transparent 50%,rgba(0,0,0,0.6)100%)',pointerEvents:'none'}}/>

      {/* HUD top */}
      <div className="cine-hud-top">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Emblem size={28}/>
          <div className="mono cine-rec-label" style={{fontSize:'clamp(8px,1.5vw,10px)',letterSpacing:'0.3em',color:'var(--gold)'}}>
            ISOLATED · {String(idx+1).padStart(2,'0')} / {String(data.clips.length).padStart(2,'0')}
          </div>
        </div>
        <div className="cine-hud-actions">
          <button onClick={onToggleAudio} className="cine-audio-btn" style={{background:audioMuted?'transparent':'var(--gold)',color:audioMuted?'#fff':'#0a0a0a',border:'1px solid '+(audioMuted?'rgba(255,255,255,0.3)':'var(--gold)')}}>
            <SpeakerIcon muted={audioMuted}/>
            {audioMuted?'SOUND ON':'MUTE'}
          </button>
          <button onClick={onExit} className="cine-hud-btn">EXIT ✕</button>
        </div>
      </div>

      {/* lower-third */}
      <div className="cine-lower">
        <div className="mono" style={{fontSize:'clamp(8px,1.2vw,10px)',letterSpacing:'0.36em',color:'var(--gold)',marginBottom:8}}>▸ {clip.tag}</div>
        <div className="h-display cine-lower-title">{clip.label}</div>
        <div style={{marginTop:6}}><BrushStroke color="var(--blue-bright)" width={Math.min(320,window.innerWidth*0.55)} height={12} seed={idx+11}/></div>
        <div className="mono" style={{fontSize:'clamp(9px,1.5vw,11px)',letterSpacing:'0.24em',color:'var(--ink)',marginTop:10}}>{clip.context}</div>
      </div>

      {/* stat tag */}
      <div className="cine-stat-tag">
        <div className="h-display" style={{fontSize:'clamp(28px,5vw,48px)',color:'var(--gold)',lineHeight:1}}>{clip.stat}</div>
        <div className="mono" style={{fontSize:10,letterSpacing:'0.32em',color:'var(--bone)',marginTop:4}}>#{data.number} · {data.position}</div>
      </div>

      {/* nav dots */}
      <div style={{position:'absolute',bottom:28,left:0,right:0,display:'flex',justifyContent:'center',gap:8}}>
        {data.clips.map((c,i)=>(<button key={c.id} onClick={()=>setIdx(i)} style={{width:28,height:6,border:'none',cursor:'pointer',background:i===idx?'var(--gold)':'rgba(255,255,255,0.25)',touchAction:'manipulation'}}/>))}
      </div>
      <div className="mono" style={{position:'absolute',bottom:10,left:0,right:0,textAlign:'center',fontSize:'clamp(7px,1.2vw,9px)',color:'var(--ink-dim)',letterSpacing:'0.24em'}}>← → CLIP · ESC EXIT</div>
    </div>
  );
}

// APP SHELL
// ═══════════════════════════════════════════════════════════

const TWEAK_DEFAULTS = { "theme": "navy" };
const data = JSON.parse(document.getElementById('lando-data').textContent);

function App() {
  const [mode, setMode] = React.useState('hub');
  const [focusedClip, setFocusedClip] = React.useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [audioMuted, setAudioMuted] = React.useState(false);
  const audioRef = React.useRef(null);
  const audioPlaying = mode==='cinematic'||mode==='cinematic-single';

  React.useEffect(() => {
    const theme = THEMES[tweaks.theme||'navy']||THEMES.navy;
    applyTheme(theme);
  }, [tweaks.theme]);

  // Sync play/pause when mode or mute changes (after gesture unlock)
  React.useEffect(() => {
    const a = audioRef.current; if (!a) return;
    a.volume = 0.85; a.muted = audioMuted;
    if (audioPlaying && !audioMuted) a.play().catch(()=>{});
    else a.pause();
  }, [audioPlaying, audioMuted]);

  // Call this synchronously inside a user-gesture handler to unlock iOS audio
  const startAudio = () => {
    const a = audioRef.current;
    if (a && !audioMuted) a.play().catch(()=>{});
  };

  const onPlayAll  = () => { startAudio(); setFocusedClip(null); setMode('cinematic'); };
  const onPlayClip = (i) => { startAudio(); setFocusedClip(i); setMode('cinematic-single'); };
  const onExit     = () => { setMode('hub'); setFocusedClip(null); };
  const toggleAudio = () => {
    const newMuted = !audioMuted;
    setAudioMuted(newMuted);
    const a = audioRef.current; if (!a) return;
    if (!newMuted && audioPlaying) a.play().catch(()=>{}); else a.pause();
  };

  return (
    <>
      {mode==='hub'           && <HubView data={data} onPlayAll={onPlayAll} onPlayClip={onPlayClip} themeKey={tweaks.theme}/>}
      {mode==='cinematic'     && <CinematicView data={data} onExit={onExit} audioMuted={audioMuted} onToggleAudio={toggleAudio}/>}
      {mode==='cinematic-single' && <SingleClipView data={data} startIdx={focusedClip} onExit={onExit} audioMuted={audioMuted} onToggleAudio={toggleAudio}/>}
      <audio ref={audioRef} src="assets/soundtrack.mp3" loop preload="auto" style={{display:'none'}}/>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Color theme"/>
        <TweakRadio label="Theme" value={tweaks.theme} onChange={v=>setTweak('theme',v)} options={['navy','midnight','blacktop','ice']}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
