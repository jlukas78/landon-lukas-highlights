function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*'); } catch(e) {}
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(e) {}
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);

  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return (
      <TweakRow label={label}>
        <select className="twk-field" value={value} onChange={(e) => onChange(resolve(e.target.value))}>
          {options.map((o) => {
            const v = typeof o === 'object' ? o.value : o;
            const l = typeof o === 'object' ? o.label : o;
            return <option key={v} value={v}>{l}</option>;
          })}
        </select>
      </TweakRow>
    );
  }

  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--navy-0', t.bg0);
  r.setProperty('--navy-1', t.bg1);
  r.setProperty('--navy-2', t.bg2);
  r.setProperty('--blue', t.blue);
  r.setProperty('--blue-bright', t.blueBright);
  r.setProperty('--gold', t.accent);
  r.setProperty('--gold-deep', t.accentDeep);
  r.setProperty('--bone', t.bone);
}

function BrushStroke({ color = "#1f5cd9", width = 320, height = 30, seed = 1, style = {} }) {
  const bands = [];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const y = (i / (N - 1)) * height;
    const wobble = Math.sin(i * 1.7 + seed) * 6;
    const x1 = 4 + Math.abs(Math.sin(i + seed)) * 8;
    const x2 = width - 4 - Math.abs(Math.cos(i * 0.6 + seed)) * 14;
    const o = 0.25 + 0.75 * (1 - Math.abs(i - N / 2) / (N / 2));
    bands.push(<line key={i} x1={x1} x2={x2} y1={y} y2={y + wobble * 0.3} stroke={color} strokeOpacity={o} strokeWidth={1.4} strokeLinecap="round" />);
  }
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{ display: 'block', ...style }}>
      <defs>
        <filter id={`b${seed}`}>
          <feTurbulence baseFrequency="0.9" numOctaves="2" seed={seed} />
          <feDisplacementMap in="SourceGraphic" scale="3" />
        </filter>
      </defs>
      <g filter={`url(#b${seed})`}>{bands}</g>
    </svg>
  );
}

function BrushSwoosh({ color = "#1f5cd9", width = 520, height = 70, seed = 3, style = {} }) {
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{ display: 'block', ...style }} preserveAspectRatio="none">
      <defs>
        <filter id={`bs${seed}`}>
          <feTurbulence baseFrequency="0.65" numOctaves="2" seed={seed} />
          <feDisplacementMap in="SourceGraphic" scale="4" />
        </filter>
        <linearGradient id={`bsg${seed}`} x1="0" x2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.9" />
          <stop offset="0.7" stopColor={color} stopOpacity="1" />
          <stop offset="1" stopColor={color} stopOpacity="0.55" />
        </linearGradient>
      </defs>
      <g filter={`url(#bs${seed})`}>
        <path d={`M 4 ${height*0.75} Q ${width*0.4} ${height*0.1}, ${width*0.7} ${height*0.55} T ${width-6} ${height*0.45}`}
              fill="none" stroke={`url(#bsg${seed})`} strokeWidth={height*0.55} strokeLinecap="round" />
      </g>
    </svg>
  );
}

function NameLockup({ first = "LANDON", last = "LUKAS", scale = 1, dark = false }) {
  const fs1 = 96 * scale, fs2 = 110 * scale;
  return (
    <div style={{ position: 'relative', display: 'inline-block', lineHeight: 0.85 }}>

function GhostNumber({ n = 5, size = 360, color = "rgba(255,255,255,0.08)", strokeColor = "rgba(255,255,255,0.22)" }) {
  return (
    <div className="h-display" style={{
      fontSize: size, lineHeight: 0.8,
      color, WebkitTextStroke: `2px ${strokeColor}`,
      letterSpacing: 0,
      pointerEvents: 'none', userSelect: 'none',
    }}>{n}</div>
  );
}

function BrushField({ opacity = 0.45 }) {
  const lines = [];
  for (let i = 0; i < 22; i++) {
    const top = `${(i * 7) - 20}%`;
    const left = `${-20 + (i % 3) * 8}%`;
    const len = 50 + (i % 4) * 16;
    const col = i % 5 === 0 ? 'var(--bone)' : 'var(--blue)';
    const op = (i % 5 === 0 ? 0.5 : 0.35) * opacity;
    lines.push(
      <div key={i} style={{
        position: 'absolute', top, left, width: `${len}%`, height: 2 + (i % 3),
        background: col, opacity: op, transform: 'rotate(-22deg)', filter: 'blur(0.4px)',
      }} />
    );
  }
  return <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>{lines}</div>;
}

function ClipCard({ clip, idx, onPlay, hovered, setHovered }) {
  const videoRef = React.useRef(null);
  const isHover = hovered === idx;

  React.useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    if (isHover) { v.currentTime = 0; v.play().catch(() => {}); }
    else { v.pause(); v.currentTime = 0; }
  }, [isHover]);

  return (
    <div
      onMouseEnter={() => setHovered(idx)}
      onMouseLeave={() => setHovered(null)}
      onClick={() => onPlay(idx)}
      style={{
        position: 'relative', cursor: 'pointer',
        background: 'var(--navy-1)',
        border: '1px solid rgba(255,255,255,0.06)',
        overflow: 'hidden',
        aspectRatio: '16/10',
        transition: 'transform 220ms ease, border-color 220ms',
        transform: isHover ? 'translateY(-4px)' : 'translateY(0)',
        borderColor: isHover ? 'var(--blue-bright)' : 'rgba(255,255,255,0.06)',
      }}
    >
      <video ref={videoRef} src={clip.src} muted playsInline preload="metadata"
        style={{
          position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
          opacity: isHover ? 1 : 0.55,
          transition: 'opacity 280ms',
          filter: isHover ? 'none' : 'saturate(0.8) contrast(1.05)',
        }}
      />
      <div style={{
        position: 'absolute', inset: 0,
        background: isHover
          ? 'linear-gradient(180deg, rgba(5,8,15,0.0) 0%, rgba(5,8,15,0.0) 50%, rgba(5,8,15,0.92) 100%)'
          : 'linear-gradient(180deg, rgba(5,8,15,0.5) 0%, rgba(16,35,65,0.4) 50%, rgba(5,8,15,0.95) 100%)',
        pointerEvents: 'none',
      }} />
      <div className="mono" style={{ position: 'absolute', top: 14, left: 14, fontSize: 11, color: 'var(--gold)', letterSpacing: '0.2em' }}>
        PLAY · {String(idx + 1).padStart(2, '0')} / 07
      </div>
      <div className="h-cond" style={{
        position: 'absolute', top: 14, right: 14,
        fontSize: 11, fontWeight: 700, letterSpacing: '0.18em',
        padding: '4px 10px',
        background: 'var(--blue)', color: '#fff',
        clipPath: 'polygon(8% 0, 100% 0, 92% 100%, 0 100%)',
      }}>{clip.tag}</div>
      <div style={{ position: 'absolute', left: 16, right: 16, bottom: 14 }}>
        <div className="h-display" style={{ fontSize: 30, lineHeight: 1, color: '#fff', letterSpacing: '0.02em', textShadow: '0 2px 10px rgba(0,0,0,0.6)' }}>{clip.label}</div>
        <div className="mono" style={{ marginTop: 4, fontSize: 10, color: 'var(--ink)', letterSpacing: '0.18em' }}>{clip.context}</div>
      </div>
      <div style={{
        position: 'absolute', right: 16, bottom: 56,
        width: 38, height: 38, borderRadius: '50%',
        background: 'var(--gold)', display: 'grid', placeItems: 'center',
        opacity: isHover ? 1 : 0,
        transform: isHover ? 'scale(1)' : 'scale(0.7)',
        transition: 'all 240ms',
      }}>
        <div style={{ width: 0, height: 0, borderLeft: '11px solid #0a0a0a', borderTop: '7px solid transparent', borderBottom: '7px solid transparent', marginLeft: 3 }} />
      </div>
    </div>
  );
}

function OutroCard({ data, onExit }) {
  return (
    <div className="cine-fade" style={{
      position: 'absolute', inset: 0, display: 'grid', placeItems: 'center',
      background: 'radial-gradient(60% 60% at 50% 50%, rgba(31,92,217,0.3), transparent 65%), #000',

        <div className="cine-pop2 h-display" style={{ fontSize: 'clamp(80px, 12vw, 180px)', lineHeight: 0.85, color: '#fff', letterSpacing: '0.02em' }}>

        </div>
        <div className="cine-pop3" style={{ marginTop: 44, display: 'inline-flex', alignItems: 'center', gap: 22 }}>

              {data.first} {data.last} · #{data.number}
            </div>
            <div className="mono" style={{ fontSize: 11, letterSpacing: '0.24em', color: 'var(--ink)', marginTop: 6 }}>
              {data.team} · {data.league} · {data.classOf}
            </div>

        </div>
        <button onClick={onExit} className="cine-pop4" style={{

          display: 'block',
        }}>BACK TO REEL</button>
      </div>
    </div>

}

function CinematicView({ data, onExit, audioMuted, onToggleAudio }) {
  const [phase, setPhase] = React.useState('intro');
  const [idx, setIdx] = React.useState(0);
  const [transition, setTransition] = React.useState('cut');
  const videoRef = React.useRef(null);

  React.useEffect(() => {
    let timer;
    if (phase === 'intro') {
      timer = setTimeout(() => { setPhase('title'); setIdx(0); }, 3600);
    } else if (phase === 'title') {
      timer = setTimeout(() => setPhase('play'), 1600);
    } else if (phase === 'transition') {
      timer = setTimeout(() => {
        if (idx + 1 >= data.clips.length) setPhase('outro');
        else { setIdx(idx + 1); setPhase('title'); }
      }, 600);
    } else if (phase === 'outro') {
      timer = setTimeout(() => onExit(), 5500);
    }
    return () => clearTimeout(timer);
  }, [phase, idx]);

  React.useEffect(() => {
    if (phase !== 'play') return;
    const v = videoRef.current;
    if (!v) return;
    v.currentTime = 0; v.muted = true; v.play().catch(() => {});
    const onEnded = () => goNext();
    const cap = setTimeout(goNext, CLIP_MAX * 1000);
    function goNext() {
      clearTimeout(cap);
      const t = TRANSITIONS[idx % TRANSITIONS.length];
      setTransition(t); setPhase('transition');
    }
    v.addEventListener('ended', onEnded);
    return () => { v.removeEventListener('ended', onEnded); clearTimeout(cap); };
  }, [phase, idx]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onExit();
      if (e.key === 'ArrowRight' && phase === 'play') {
        const t = TRANSITIONS[idx % TRANSITIONS.length];
        setTransition(t); setPhase('transition');
      }
      if ((e.key === 'm' || e.key === 'M') && onToggleAudio) onToggleAudio();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [phase, idx, onToggleAudio]);

  const clip = data.clips[idx];
  const total = data.clips.length;

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: '#000', overflow: 'hidden', fontFamily: 'Barlow, sans-serif' }}>
      <CinematicHUD idx={idx} total={total} phase={phase} clip={clip} data={data} onExit={onExit} audioMuted={audioMuted} onToggleAudio={onToggleAudio} />
      {phase === 'intro' && <IntroCard data={data} />}
      {phase === 'title' && <TitleCard clip={clip} idx={idx} total={total} />}
      {(phase === 'play' || phase === 'transition') && (
        <ClipStage videoRef={videoRef} clip={clip} phase={phase} transition={transition} idx={idx} total={total} data={data} />
      )}
      {phase === 'outro' && <OutroCard data={data} onExit={onExit} />}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════

function ReelAudio({ playing, muted, volume = 0.85 }) {
  const audioRef = React.useRef(null);

  React.useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    const v = volume > 1 ? volume / 100 : volume;
    a.volume = Math.max(0, Math.min(1, v));
    a.muted = muted;
    if (playing) { a.play().catch(() => {}); }
    else { a.pause(); }
  }, [playing, muted, volume]);

  return <audio ref={audioRef} src="assets/soundtrack.mp3" loop preload="auto" style={{ display: 'none' }} />;
}

// ═══════════════════════════════════════════════════════════
// SINGLE CLIP VIEW
// ═══════════════════════════════════════════════════════════

function SingleClipView({ data, startIdx, onExit, audioMuted, onToggleAudio }) {
  const [idx, setIdx] = React.useState(startIdx);
  const clip = data.clips[idx];
  const ref = React.useRef(null);

  React.useEffect(() => {
    const v = ref.current; if (!v) return;
    v.currentTime = 0; v.muted = true; v.play().catch(() => {});
    const onEnd = () => { if (idx + 1 < data.clips.length) setIdx(idx + 1); else onExit(); };
    v.addEventListener('ended', onEnd);
    return () => v.removeEventListener('ended', onEnd);
  }, [idx]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onExit();
      if (e.key === 'ArrowRight') setIdx(i => Math.min(i + 1, data.clips.length - 1));
      if (e.key === 'ArrowLeft')  setIdx(i => Math.max(i - 1, 0));
      if ((e.key === 'm' || e.key === 'M') && onToggleAudio) onToggleAudio();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onToggleAudio]);

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: '#000' }}>
      <video ref={ref} src={clip.src} muted playsInline
        style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
      <div style={{
        position: 'absolute', inset: 0,
        background: 'radial-gradient(75% 65% at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%)',
        pointerEvents: 'none',
      }} />

      {/* HUD */}
      <div style={{ position: 'absolute', top: 20, left: 28, right: 28, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <Emblem size={32} />
          <div className="mono" style={{ fontSize: 10, letterSpacing: '0.3em', color: 'var(--gold)' }}>
            ISOLATED · {String(idx + 1).padStart(2, '0')} / {String(data.clips.length).padStart(2, '0')}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <button onClick={onToggleAudio} title={audioMuted ? 'Unmute soundtrack' : 'Mute soundtrack'} style={{
            background: audioMuted ? 'transparent' : 'var(--gold)',
            color: audioMuted ? '#fff' : '#0a0a0a',
            border: '1px solid ' + (audioMuted ? 'rgba(255,255,255,0.3)' : 'var(--gold)'),
            padding: '6px 12px', cursor: 'pointer',
            fontFamily: 'Bebas Neue, sans-serif', letterSpacing: '0.2em', fontSize: 13,
            display: 'inline-flex', alignItems: 'center', gap: 8,
          }}>
            <SpeakerIcon muted={audioMuted} />
            {audioMuted ? 'SOUND ON' : 'MUTE'}
          </button>
          <button onClick={onExit} style={{
            background: 'transparent', border: '1px solid rgba(255,255,255,0.3)',
            color: '#fff', padding: '6px 12px', cursor: 'pointer',
            fontFamily: 'Bebas Neue, sans-serif', letterSpacing: '0.2em', fontSize: 13,
          }}>EXIT ✕</button>
        </div>
      </div>

      {/* lower-third */}
      <div style={{ position: 'absolute', left: 36, bottom: 60, animation: 'slideUp 500ms ease both', maxWidth: 540 }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.36em', color: 'var(--gold)', marginBottom: 10 }}>▸ {clip.tag}</div>
        <div className="h-display" style={{ fontSize: 64, lineHeight: 0.9, color: '#fff', letterSpacing: '0.02em' }}>{clip.label}</div>
        <div style={{ marginTop: 6 }}><BrushStroke color="var(--blue-bright)" width={320} height={12} seed={idx + 11} /></div>
        <div className="mono" style={{ fontSize: 11, letterSpacing: '0.24em', color: 'var(--ink)', marginTop: 12 }}>{clip.context}</div>
      </div>

      <div style={{ position: 'absolute', right: 36, top: 80, textAlign: 'right' }}>
        <div className="h-display" style={{ fontSize: 48, color: 'var(--gold)', lineHeight: 1 }}>{clip.stat}</div>
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.32em', color: 'var(--bone)', marginTop: 4 }}>#{data.number} · {data.position}</div>
      </div>

      {/* nav dots */}
      <div style={{ position: 'absolute', bottom: 28, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 10 }}>
        {data.clips.map((c, i) => (
          <button key={c.id} onClick={() => setIdx(i)} style={{
            width: 28, height: 6, border: 'none', cursor: 'pointer',
            background: i === idx ? 'var(--gold)' : 'rgba(255,255,255,0.25)',
          }} />
        ))}
      </div>
      <div className="mono" style={{ position: 'absolute', bottom: 8, left: 0, right: 0, textAlign: 'center', fontSize: 9, color: 'var(--ink-dim)', letterSpacing: '0.24em' }}>
        ← → CLIP · ESC EXIT
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// APP SHELL
// ═══════════════════════════════════════════════════════════

const TWEAK_DEFAULTS = { "theme": "navy" };

function App() {
  const data = JSON.parse(document.getElementById('lando-data').textContent);
  const [mode, setMode] = React.useState('hub');
  const [focusedClip, setFocusedClip] = React.useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [audioMuted, setAudioMuted] = React.useState(false);
  const audioPlaying = mode === 'cinematic' || mode === 'cinematic-single';

  React.useEffect(() => {
    const themeKey = tweaks.theme || 'navy';
    const theme = THEMES[themeKey] || THEMES.navy;
    applyTheme(theme);
  }, [tweaks.theme]);

  const onPlayAll = () => { setFocusedClip(null); setMode('cinematic'); };
  const onPlayClip = (i) => { setFocusedClip(i); setMode('cinematic-single'); };
  const onExit = () => { setMode('hub'); setFocusedClip(null); };

  return (
    <>
      {mode === 'hub' && (
        <HubView data={data} onPlayAll={onPlayAll} onPlayClip={onPlayClip} themeKey={tweaks.theme} />
      )}
      {mode === 'cinematic' && (
        <CinematicView data={data} onExit={onExit} audioMuted={audioMuted} onToggleAudio={() => setAudioMuted(m => !m)} />
      )}
      {mode === 'cinematic-single' && (
        <SingleClipView data={data} startIdx={focusedClip} onExit={onExit} audioMuted={audioMuted} onToggleAudio={() => setAudioMuted(m => !m)} />
      )}

      <ReelAudio playing={audioPlaying} muted={audioMuted} volume={85} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Color theme" />
        <TweakRadio
          label="Theme"
          value={tweaks.theme}
          onChange={(v) => setTweak('theme', v)}
          options={['navy', 'midnight', 'blacktop', 'ice']}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
